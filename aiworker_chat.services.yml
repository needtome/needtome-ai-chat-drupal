services:
  aiworker_chat.host:
    class: Drupal\aiworker_chat\DrupalHost
    arguments:
      - '@config.factory'
      - '@keyvalue'
      - '@cache.default'
      - '@cache_tags.invalidator'
      - '@lock'
      - '@request_stack'
      - '@current_user'
      - '@entity_type.manager'
      - '@account_switcher'
      - '@renderer'
      - '@language_manager'
      - '@module_handler'
      - '@database'
      - '@queue'
      - '@entity_field.manager'
  aiworker_chat.http:
    class: Drupal\aiworker_chat\Common\CurlHttp
    arguments: ['drupal']
  aiworker_chat.token_crypto:
    class: Drupal\aiworker_chat\Common\TokenCrypto
    factory: ['@aiworker_chat.host', 'createTokenCrypto']
  aiworker_chat.oauth:
    class: Drupal\aiworker_chat\Common\OAuth
    arguments: ['@aiworker_chat.host', '@aiworker_chat.http', '@aiworker_chat.token_crypto']
  aiworker_chat.kra_client:
    class: Drupal\aiworker_chat\Common\KraClient
    arguments: ['@aiworker_chat.host', '@aiworker_chat.http', '@aiworker_chat.oauth']
  aiworker_chat.proxy_rules:
    class: Drupal\aiworker_chat\Common\ProxyRules
  aiworker_chat.rate_limiter:
    class: Drupal\aiworker_chat\Common\RateLimiter
    arguments: ['@aiworker_chat.host']
  aiworker_chat.sync_engine:
    class: Drupal\aiworker_chat\Common\SyncEngine
    arguments: ['@aiworker_chat.host', '@aiworker_chat.kra_client', '@aiworker_chat.batcher', '@aiworker_chat.sleeper']
  aiworker_chat.batcher:
    class: Drupal\aiworker_chat\Common\Batcher
  aiworker_chat.sleeper:
    class: Drupal\aiworker_chat\Common\Sleeper
  aiworker_chat.admin_api:
    class: Drupal\aiworker_chat\Common\AdminApi
    arguments: ['@aiworker_chat.host', '@aiworker_chat.oauth', '@aiworker_chat.kra_client', '@aiworker_chat.sync_engine', '@aiworker_chat.proxy_rules', '@aiworker_chat.rate_limiter']
  Drupal\aiworker_chat\Controller\AdminController:
    arguments:
      - '@aiworker_chat.admin_api'
      - '@aiworker_chat.host'
      - '@csrf_token'
      - '@current_user'
      - '@request_stack'
      - '@cache_tags.invalidator'
      - '@string_translation'
