aiworker_chat.settings:
  type: config_object
  label: 'AI Worker Chat settings'
  mapping:
    base:
      type: string
      label: 'AI Worker base URL'
    site_url:
      type: string
      label: 'Site URL for Drush and cron'
    sync_interval:
      type: integer
      label: 'Synchronization interval in seconds'
